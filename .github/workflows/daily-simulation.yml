name: Daily PM simulation

# 平日 09:00 JST に、モックの Issue / Status を「今日の Day」まで進め、
# フィーバーチャート指標を更新する。Insights の履歴グラフは実時間でしか溜まらないため毎日動かす。
on:
  schedule:
    - cron: "0 0 * * 1-5" # 00:00 UTC = 09:00 JST (平日)
  workflow_dispatch:
    inputs:
      day:
        description: "Day を明示する場合 (空なら開始日からの営業日数)"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: pm-simulation
  cancel-in-progress: false

jobs:
  simulate:
    runs-on: ubuntu-latest
    env:
      # Projects (v2) は GITHUB_TOKEN では操作できないため、`repo` + `project` スコープの PAT を登録する
      GH_TOKEN: ${{ secrets.PROJECT_TOKEN }}
      DAY_ARG: ${{ github.event.inputs.day && format('--day {0}', github.event.inputs.day) || '' }}
    steps:
      - uses: actions/checkout@v7

      - name: Check setup
        id: check
        run: |
          if [ -f mock/state.json ]; then echo "ready=true" >> "$GITHUB_OUTPUT"
          else echo "::notice::mock/state.json がないためスキップ (先にローカルで setup を実行)"; fi

      - uses: actions/setup-python@v7
        if: steps.check.outputs.ready == 'true'
        with:
          python-version: "3.12"

      - name: Advance simulation
        if: steps.check.outputs.ready == 'true'
        run: python scripts/pm.py tick $DAY_ARG

      - name: Update fever metrics
        if: steps.check.outputs.ready == 'true'
        run: python scripts/pm.py fever $DAY_ARG

      - name: Commit fever history / chart
        if: steps.check.outputs.ready == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/fever-history.json docs/fever-chart.svg
          git diff --cached --quiet || git commit -m "chore: update fever chart ($(date -u +%F))"
          git push

      - name: Summary
        if: steps.check.outputs.ready == 'true'
        run: |
          echo "## Fever chart" >> "$GITHUB_STEP_SUMMARY"
          python -c "import json;h=json.load(open('docs/fever-history.json'))[-1];print(f\"Day {h['day']}: progress {h['progress']}% / buffer {h['buffer']}% / {h['zone']}\")" >> "$GITHUB_STEP_SUMMARY"
